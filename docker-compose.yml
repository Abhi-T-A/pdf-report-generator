services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost URLs with Docker service names for inter-container networking
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/pdf_report_db"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - report_storage:/app/storage/reports

  worker:
    build: .
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -Q reports
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/pdf_report_db"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - report_storage:/app/storage/reports

  beat:
    build: .
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/pdf_report_db"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  redis:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"  # host:container — avoids conflict with local Redis on 6379

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdf_report_db
    ports:
      - "5433:5432"  # host:container — avoids conflict with local Postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  report_storage:  # shared between api and worker so PDFs are accessible for download
